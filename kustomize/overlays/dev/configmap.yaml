# dev 환경용 ConfigMap - 기존 k8s/configmap.yaml 내용을 그대로 사용 (H2 인메모리 DB)
apiVersion: v1
kind: ConfigMap
metadata:
  name: sk0115-backend-configmap
  namespace: class-4
data:
  application-prod.yaml: |
    server:
      port: 8080

    developer:
      owner:
        name: sk0115
        role: kubernetes
        level: high
      team:
        position: "5th floor"
        detail: class-4

    # H2 설정
    spring:
      datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
        username: sa
        password:
      h2:
        console:
          enabled: true
          path: /h2-console
      jpa:
        hibernate:
          ddl-auto: create-drop
        show-sql: true
        defer-datasource-initialization: true
      sql:
        init:
          mode: always
